name: Publish Hot Fix

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: read

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    env:
      # Read by NuGet.config to authenticate against the private DEFRA feed.
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
        with:
          fetch-depth: 0 # Depth 0 required for branch-based versioning
      - name: Setup dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5
        with:
          dotnet-version: |
            10.0
      - name: Publish Hot Fix
        # TODO: repoint at a DEFRA SHA once DEFRA/cdp-build-action PR 120 merges.
        # build-secrets does not exist on the DEFRA ref yet.
        uses: d-ee-klemm/cdp-build-action/build-hotfix@docker-build-args
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-secrets: |
            nuget_pat=${{ secrets.GITHUB_TOKEN }}
    ## SonarCloud
    ## Uncomment to unable SonarCloud scan
    ## Requires project to be set up in SonarCloud
    ## and the SonarCloud token to be set in the repository secrets
